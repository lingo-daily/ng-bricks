name: Tag release

# Tags the version that version-bump.yml committed, once a feat/* or fix/*
# PR lands on main. The version is read from projects/ng-bricks/package.json
# (the published package's manifest), not the workspace root package.json.
#
# A tag is a small ref pointing at an existing commit, not a copy of the
# tree/blobs it points to, so this does not meaningfully grow clone size even
# over hundreds of releases. No commit is created here, only a ref.
#
# Bare semver (e.g. "1.1.0"), no "v" prefix.

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Push release tag
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') || startsWith(github.event.pull_request.head.ref, 'fix/'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag the merge commit with the version it carries
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          VERSION="$(jq -r .version projects/ng-bricks/package.json)"

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION} (#${PR_NUMBER})"
          git push origin "${VERSION}"

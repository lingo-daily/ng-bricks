<mat-tab-group
  [selectedIndex]="selectedTabIndex()"
  (selectedIndexChange)="selectedTabIndex.set($event)"
>
  <mat-tab [label]="fileTabLabel()"></mat-tab>
  <mat-tab [label]="urlTabLabel()">
    @for (control of urlControls(); track control) {
      <mat-form-field>
        <mat-label>{{ urlInputLabel() }}</mat-label>
        <input matInput type="url" [formControl]="control" />
        @if (control.invalid && (control.dirty || control.touched)) {
          <mat-error>{{ invalidUrlErrorLabel() }}</mat-error>
        }
      </mat-form-field>
    }
    @if (multiple()) {
      <button mat-stroked-button type="button" (click)="addUrlControl()">
        {{ addUrlButtonLabel() }}
      </button>
    }
  </mat-tab>
</mat-tab-group>
